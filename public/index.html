<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#c4401f"><title>Hamburguesas y Pinchos Fercho</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍔%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f7f2ea;--card:#fff;--tx:#2b211b;--mut:#7b6e63;--pri:#c4401f;--onpri:#fff;--ok:#2e7d4f;--warn:#b86e00;--bad:#c4301f;--bd:#e8dccd;--soft:#f1e9dd;--sh:0 1px 3px #0001,0 6px 18px #0000000d}
@media(prefers-color-scheme:dark){:root{--bg:#171210;--card:#241d19;--tx:#f4ece4;--mut:#b5a89b;--pri:#ee6c46;--onpri:#1d0f08;--ok:#5fc08a;--warn:#e8a33a;--bad:#ff7a66;--bd:#3a3029;--soft:#2e2620;--sh:none}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 14px 0;box-shadow:var(--sh)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:6px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;color:var(--mut);padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}
main{padding:14px;max-width:1100px;margin:auto}
h3{margin:18px 0 8px}h3:first-child{margin-top:4px}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;min-height:42px}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.ok{background:var(--ok);color:#fff}.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px}.btn.lg{width:100%;min-height:50px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--soft)}
.pill.ok,.st-listo,.st-entregado{color:var(--ok)}.pill.bad,.st-cancelado{color:var(--bad)}.st-espera{color:var(--warn)}.st-preparacion{color:#2b6cb0}.st-entregando{color:#805ad5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.mut{color:var(--mut);font-size:13px}.k{font-size:22px;font-weight:800}.num{font-size:22px;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.acts{margin-top:8px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
input.mini{width:90px;padding:6px;margin:0}input[type=checkbox]{width:auto;margin:0}
.aviso{border-radius:12px;padding:11px 14px;margin-bottom:12px;font-weight:600;background:var(--soft)}.aviso.bad{color:var(--bad)}
.tools{position:sticky;top:96px;z-index:5;background:var(--bg);padding:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:var(--tx);cursor:pointer;box-shadow:var(--sh)}
.pcard:disabled{opacity:.5;cursor:not-allowed}.pcard .precio{font-weight:800;color:var(--pri)}
.pic{height:96px;display:flex;align-items:center;justify-content:center;font-size:54px;overflow:hidden;border-radius:12px;background:var(--soft)}.pic img{width:100%;height:100%;object-fit:cover}
.cat{margin:16px 0 8px;font-size:17px}
#cartbar{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);display:none}
#cartbar .btn{width:100%;display:flex;justify-content:space-between}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:50;overflow:auto}
@media(min-width:620px){.ov{align-items:center;padding:16px}}
.box{background:var(--card);border-radius:20px 20px 0 0;padding:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
@media(min-width:620px){.box{border-radius:20px}}
.chk{display:flex;gap:10px;align-items:center;padding:6px 0}
.stepper{display:flex;align-items:center;gap:12px;justify-content:center;margin:8px 0}.stepper b{font-size:22px;min-width:34px;text-align:center}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:22px;cursor:pointer}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin:6px 0}.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:10px;font:inherit;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.steps{display:flex;gap:6px;margin:12px 0}.step{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.step i{display:flex;margin:0 auto 4px;width:30px;height:30px;border-radius:50%;background:var(--soft);align-items:center;justify-content:center;font-style:normal;font-weight:800}
.step.done i{background:var(--ok);color:#fff}.step.now i{background:var(--pri);color:var(--onpri);box-shadow:0 0 0 4px #c4401f33}.step.now{color:var(--tx);font-weight:700}
.kds{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}@media(max-width:760px){.kds{grid-template-columns:1fr}}
.kcol>h3{display:flex;justify-content:space-between}
.kcard{background:var(--card);border:1px solid var(--bd);border-left:8px solid var(--ok);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:var(--sh)}
.kcard.warn,.ocard.warn{border-left-color:var(--warn)}.kcard.late,.ocard.late{border-left-color:var(--bad);animation:pulso 1.4s infinite}
@keyframes pulso{50%{box-shadow:0 0 0 4px #c4301f44}}
.ocard{border-left:6px solid var(--ok)}
.khead{display:flex;align-items:center;gap:10px}.khead .num{font-size:30px}.khead .dest{flex:1;font-weight:700}
.crono{font:800 22px/1 ui-monospace,Menlo,Consolas,monospace}.crono.mini{font-size:15px;color:var(--mut)}
.kit{display:flex;gap:10px;padding:9px 6px;border-radius:10px;cursor:pointer;font-size:17px;align-items:flex-start}.kit:active{background:var(--soft)}.kit.done{opacity:.5;text-decoration:line-through}
.sin{color:var(--bad);font-weight:700;font-size:14px}.nota{color:var(--warn);font-weight:600;font-size:14px}
.big{font-size:40px;font-weight:800;text-align:center}.vueltos{font-size:26px;font-weight:800;color:var(--ok);text-align:center}.falta{font-size:20px;font-weight:700;color:var(--bad);text-align:center}
.recibo{background:var(--soft);border-radius:14px;padding:10px 12px;margin:10px 0;text-align:center}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px;white-space:nowrap}td.r,th.r{text-align:right}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.tile .v{font-size:22px;font-weight:800}.pos{color:var(--ok)}.neg{color:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}.bars>div{flex:1;background:var(--pri);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.bars.lb{height:auto;margin-top:2px;align-items:flex-start}.bars.lb span{flex:1;text-align:center;font-size:10px;color:var(--mut)}
.hbar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;min-width:70px}.hbar>i{display:block;height:100%;background:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.two{grid-template-columns:1fr}}
.al{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 14px;background:#2b6cb0;color:#fff;font-weight:600}.al.bad{background:#c4301f}.al .btn{color:#fff;border-color:#fff8}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.qrs .card{align-items:center;display:flex;flex-direction:column}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#2b211b;color:#fff;padding:11px 18px;border-radius:12px;z-index:90;display:none;max-width:90vw;font-weight:600;box-shadow:0 6px 24px #0006}#toast.bad{background:#c4301f}
.vacio{text-align:center;padding:30px 14px}.vacio .btn{margin-top:10px}
#ticket{display:none}@media print{body>*:not(#ticket){display:none!important}#ticket{display:block;font:14px/1.4 monospace;width:72mm}#ticket hr{border:0;border-top:1px dashed #000}}
</style></head><body>
<header><div class="top"><div class="brand">🍔 Fercho <span id="estado"></span></div><div id="who"></div></div><div class="tabs" id="nav"></div></header>
<div id="net" class="al bad" style="display:none;justify-content:center">⚠ Sin conexión con el servidor. Reintentando… Si dura, usa comandas en papel.</div><div id="alertas"></div><main id="app"></main><div id="cartbar"></div><div id="modal"></div><div id="toast"></div><div id="ticket"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ===================== Utilidades ===================== */
const $=s=>document.querySelector(s);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(Number(n)||0).toLocaleString('es-CO');
const hora=t=>new Date(t).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
const fh=t=>new Date(t).toLocaleString('es-CO',{dateStyle:'short',timeStyle:'short'});
const sg=d=>(d>0?'+':d<0?'-':'')+money(Math.abs(d));
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
let OFF=0;const now=()=>Date.now()+OFF;   // corrige la diferencia entre el reloj del dispositivo y el del servidor
const BILLETES=[2000,5000,10000,20000,50000,100000];
const CAMBIO=[100000,50000,20000,10000,5000,2000,1000,500,200,100,50];
const desglose=v=>{const o=[];for(const d of CAMBIO){const n=Math.floor(v/d);if(n){o.push(n+' × '+money(d));v-=n*d}}return o.join(' + ')};
const LBL={espera:'En espera',preparacion:'En preparación',listo:'Listo',entregando:'Entregando',entregado:'Entregado',cancelado:'Cancelado'};
const flow=p=>p.tipo==='domicilio'?['espera','preparacion','listo','entregando','entregado']:['espera','preparacion','listo','entregado'];
let tt;function toast(m,bad){const t=$('#toast');t.className=bad?'bad':'';t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>{t.style.display='none'},bad?5200:2800)}
const fail=e=>toast(e.message||'Error',true);
const modal=h=>{$('#modal').innerHTML=`<div class="ov">${h}</div>`};
const closeM=()=>{$('#modal').innerHTML=''};
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}}
async function api(m,u,b,form){const h={'X-Requested-With':'fercho'};let body;if(form)body=b;else if(b!==undefined){h['content-type']='application/json';body=JSON.stringify(b)}
 let r;try{r=await fetch('/api'+u,{method:m,headers:h,body,credentials:'same-origin'});netOk(true)}catch(e){netOk(false);throw new Error('Sin conexión con el servidor. Reintentando…')}
 const dh=r.headers&&r.headers.get&&r.headers.get('date');if(dh){const t=Date.parse(dh);if(t)OFF=t-Date.now()}
 const j=r.status===204?null:await r.json().catch(()=>null);
 if(!r.ok){if(r.status===401&&U&&!u.startsWith('/login')&&u!=='/cambiar-password')sesionVencida();if(j&&j.codigo==='2FA_REQUERIDA')setup2faM();throw new Error((j&&j.error)||'Error de conexión')}return j}
function netOk(v){const n=$('#net');if(n)n.style.display=v?'none':'block'}
addEventListener('online',()=>{if(typeof render==='function')render()});
/* ===================== Estado ===================== */
let U=null,view='menu',cart=[],M=[],C={abierto:false},D={},mio=ls('mio'),cat=0,busq='',prevN=null,prevU=null,AL=[],filtro='todos',pay=null,item=null,sending=false,nMesas=12,lastPay=null;
const LATE=new Set();
const cont={rango:'mes',desde:'',hasta:'',tab:'res',per:'dia'};
let F={tipo:'mesa',pago:'efectivo',mesa:new URLSearchParams(location.search).get('mesa')||'',cli:'',tel:'',dir:'',ref:''};
const staff=()=>U&&['caja','admin'].includes(U.rol);
const home=()=>!U?'menu':U.rol==='cocina'?'cocina':U.rol==='caja'?'caja':'cont';
const go=v=>{view=v;prevN=null;prevU=null;render()};
async function load(){D.err=null;try{
 const jobs=[api('GET','/config').then(x=>{C=x})],v=view;
 if(v==='menu')jobs.push(api('GET','/menu').then(x=>{M=x}));
 else if(v==='mio')jobs.push((mio?api('GET','/pedidos/'+mio+'/estado').catch(()=>null):Promise.resolve(null)).then(x=>{D.mio=x}));
 else if(v==='cocina')jobs.push(api('GET','/pedidos').then(x=>{D.ped=x}));
 else if(v==='caja'){jobs.push(api('GET','/pedidos').then(x=>{D.ped=x}),api('GET','/turno').then(x=>{D.turno=x}));if(U.rol==='admin')jobs.push(api('GET','/caja/hoy').then(x=>{D.hoy=x}))}
 else if(v==='tur')jobs.push(api('GET','/turnos').then(x=>{D.tur=x}),api('GET','/turno').then(x=>{D.turno=x}));
 else if(v==='cont')jobs.push(loadCont());
 else if(v==='inv')jobs.push(api('GET','/insumos').then(x=>{D.ins=x}),api('GET','/menu').then(x=>{M=x}));
 else if(v==='usr')jobs.push(api('GET','/usuarios').then(x=>{D.usr=x}),api('GET','/accesos').then(x=>{D.acc=x}));
 await Promise.all(jobs)}catch(e){D.err=e.message}}
async function render(){await load();draw()}
function nav(){const r=U&&U.rol,t=[];
 if(r!=='cocina')t.push(['menu',r==='caja'||r==='admin'?'🧾 Nuevo pedido':'🍔 Menú']);
 if(!U)t.push(['mio','📍 Mi pedido']);
 if(r==='admin'||r==='cocina')t.push(['cocina','👨‍🍳 Cocina']);
 if(r==='admin'||r==='caja')t.push(['caja','💵 Caja']);
 if(r==='admin')t.push(['cont','📊 Contabilidad'],['tur','🧾 Turnos'],['inv','📦 Inventario'],['usr','👥 Usuarios'],['qr','🔳 QR']);
 return t.map(([v,l])=>`<button class="tab ${view===v?'on':''}" onclick="go('${v}')">${l}</button>`).join('')}
function draw(){
 $('#nav').innerHTML=nav();
 $('#estado').innerHTML=`<span class="pill ${C.abierto?'ok':'bad'}">${C.abierto?'● Abierto':'● Cerrado'}</span>`;
 $('#who').innerHTML=U?`<span class="mut">${esc(U.u)}</span> ${U.totp?(U.ex?'':'<button class="btn sm ghost" onclick="desact2faM()" title="Desactivar verificación en dos pasos">🔓</button>'):'<button class="btn sm ghost" onclick="setup2faM()" title="Activar verificación en dos pasos">🔐</button>'} <button class="btn sm ghost" onclick="passM(0)" title="Cambiar contraseña">🔑</button> <button class="btn sm ghost" onclick="logout()">Salir</button>`:`<button class="btn sm ghost" onclick="loginM()">Personal</button>`;
 const v={menu:vMenu,mio:vMio,cocina:vCocina,caja:vCaja,cont:vCont,tur:vTur,inv:vInv,usr:vUsr,qr:vQr}[view]||vMenu;
 $('#app').innerHTML=(D.err?`<div class="aviso bad">${esc(D.err)}</div>`:'')+v();
 cartBar();
 if(view==='qr')pintaQr();
 tick()}
/* ===================== Cliente: menú y pedido ===================== */
const cats=()=>[...new Set(M.map(p=>p.categoria||'General'))];
const cardP=p=>`<button class="pcard" ${p.agotado||!C.abierto?'disabled':''} onclick="openItem(${p.id})"><div class="pic">${p.foto?`<img src="${esc(p.foto)}" alt="">`:esc(p.emoji||'🍽️')}</div><b>${esc(p.nombre)}</b>${p.descripcion?`<span class="mut">${esc(p.descripcion)}</span>`:''}<span class="precio">${p.agotado?'Agotado':money(p.precio)}</span></button>`;
function menuGrid(){const cs=cats(),sel=cat>0?cs[cat-1]:null,q=busq.trim().toLowerCase();
 const l=M.filter(p=>(!sel||p.categoria===sel)&&(!q||p.nombre.toLowerCase().includes(q)));
 if(!l.length)return '<div class="card vacio">No encontramos productos con ese filtro.</div>';
 if(sel||q)return `<div class="grid">${l.map(cardP).join('')}</div>`;
 return cs.map(c=>{const g=l.filter(p=>p.categoria===c);return g.length?`<h3 class="cat">${esc(c)}</h3><div class="grid">${g.map(cardP).join('')}</div>`:''}).join('')}
function vMenu(){const cs=cats();
 return (!C.abierto?`<div class="aviso bad">🔒 ${U?'La caja está cerrada: ábrela en la pestaña Caja para tomar pedidos.':'Estamos cerrados por ahora. ¡Vuelve cuando abramos!'}</div>`:'')+
 `<div class="tools"><input id="bq" placeholder="🔍 Buscar en el menú" value="${esc(busq)}" oninput="busq=this.value;$('#mlist').innerHTML=menuGrid()"><div class="chips">${['Todo',...cs].map((c,i)=>`<button class="chip ${cat===i?'on':''}" onclick="setCat(${i})">${esc(c)}</button>`).join('')}</div></div><div id="mlist">${menuGrid()}</div>`}
function setCat(i){cat=i;draw()}
function openItem(id){const p=M.find(x=>x.id===id);if(!p)return;item={p,qty:1};
 modal(`<div class="box"><h3>${esc(p.emoji||'')} ${esc(p.nombre)}</h3>${p.descripcion?`<p class="mut">${esc(p.descripcion)}</p>`:''}${p.ingredientes.length?'<p class="mut">¿Quieres quitar algo?</p>':''}${p.ingredientes.map(n=>`<label class="chk"><input type="checkbox" value="${esc(n)}"> Sin ${esc(n)}</label>`).join('')}<input id="nota" maxlength="200" placeholder="Cómo lo quieres (ej: carne bien cocida)"><div class="stepper"><button onclick="iq(-1)">−</button><b id="iq">1</b><button onclick="iq(1)">+</button></div><div class="row"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn" style="flex:1" id="iadd" onclick="addCart()">Añadir · ${money(p.precio)}</button></div></div>`)}
function iq(d){item.qty=Math.min(50,Math.max(1,item.qty+d));$('#iq').textContent=item.qty;$('#iadd').textContent='Añadir · '+money(item.p.precio*item.qty)}
function addCart(){cart.push({plato_id:item.p.id,cantidad:item.qty,sin:[...document.querySelectorAll('#modal input[type=checkbox]:checked')].map(c=>c.value),nota:$('#nota').value});closeM();toast('Añadido: '+item.p.nombre);cartBar()}
const cartTotal=()=>cart.reduce((a,c)=>{const p=M.find(x=>x.id===c.plato_id);return a+(p?Number(p.precio)*c.cantidad:0)},0);
function cartBar(){const b=$('#cartbar');if(!cart.length||view!=='menu'){b.style.display='none';return}
 b.style.display='block';b.innerHTML=`<button class="btn lg" onclick="cartM()"><span>🛒 ${cart.reduce((a,c)=>a+c.cantidad,0)} productos</span><span>Ver pedido · ${money(cartTotal())}</span></button>`}
function cartM(){if(!cart.length){closeM();return}const t=cartTotal(),nq=!!C.nequi_numero;
 const tipos=[['mesa','🍽️ En mesa'],['domicilio','🛵 Domicilio']].concat(staff()?[['mostrador','🧾 Mostrador']]:[]);
 if(!tipos.some(x=>x[0]===F.tipo))F.tipo='mesa';if(F.pago==='nequi'&&!nq)F.pago='efectivo';

function rangoFechas(k){const d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Bogota'})),f=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'),fin=new Date(d),ini=new Date(d);
 if(k==='ayer'){fin.setDate(fin.getDate()-1);ini.setDate(ini.getDate()-1)}else if(k==='sem')ini.setDate(ini.getDate()-6);else if(k==='mes')ini.setDate(1);else if(k==='mesp'){ini.setMonth(ini.getMonth()-1,1);fin.setDate(0)}else if(k==='anio')ini.setMonth(0,1);
 return [f(ini),f(fin)]}

 if(cont.tab==='per'){const s=D.ser||[];return head+`<div class="seg">${[['dia','Diario'],['mes','Mensual'],['anio','Anual']].map(([k,n])=>`<button class="${cont.per===k?'on':''}" onclick="cont.per='${k}';render()">${n}</button>`).join('')}</div><div class="card sc"><table><tr><th>Periodo</th><th class="r">Pedidos</th><th class="r">Ventas</th><th class="r">Efectivo</th><th class="r">Nequi</th><th class="r">Gastos</th><th class="r">Resultado</th></tr>${s.map(x=>`<tr><td>${esc(x.periodo)}</td><td class="r">${x.pedidos}</td><td class="r">${money(x.total)}</td><td class="r">${money(x.efectivo)}</td><td class="r">${money(x.nequi)}</td><td class="r">${money(x.gastos)}</td><td class="r ${Number(x.resultado)>=0?'pos':'neg'}"><b>${money(x.resultado)}</b></td></tr>`).join('')||'<tr><td colspan="7" class="mut">Aún no hay ventas</td></tr>'}</table></div><p class="mut">El resultado es ventas menos gastos. Los números de pedido reinician cada jornada, pero todas las ventas cuentan aquí.</p>`}

/* ===================== Usuarios y QR ===================== */
function vUsr(){return `<div class="card sc"><table><tr><th>Usuario</th><th>Rol</th><th>2FA</th><th></th></tr>${(D.usr||[]).map(u=>`<tr><td>${esc(u.usuario)} ${u.activo?'':'<span class="pill">inactivo</span>'}</td><td>${u.rol}</td><td>${u.totp_activo?'✔':'—'}</td><td><button class="btn sm ghost" onclick="passM(${u.id})">Nueva clave</button> ${u.totp_activo?`<button class="btn sm ghost" onclick="reset2fa(${u.id})">Quitar 2FA</button> `:''}<button class="btn sm ghost" onclick="togUsr(${u.id},${!u.activo})">${u.activo?'Desactivar':'Activar'}</button></td></tr>`).join('')}</table></div>
 <div class="card"><b>Nuevo usuario</b><input id="nu" placeholder="Usuario (minúsculas)"><select id="nr"><option value="cocina">Cocina</option><option value="caja">Caja</option><option value="admin">Administrador</option></select><input id="np" type="password" placeholder="Contraseña (mín. 10, letras y números)"><button class="btn" onclick="addUsr()">Crear</button></div>
 <h3>Últimos accesos</h3><div class="card sc"><table><tr><th>Cuándo</th><th>Usuario</th><th>Resultado</th><th>Red / dispositivo</th></tr>${(D.acc||[]).map(a=>`<tr><td>${fh(a.creado_en)}</td><td>${esc(a.usuario_intentado)}</td><td class="${a.exito?'':'sin'}">${a.exito?'✔ entró':'✖ falló'+(a.motivo?' ('+esc(a.motivo)+')':'')}</td><td class="mut">${esc(a.ip)} · ${esc((a.dispositivo||'').slice(0,45))}</td></tr>`).join('')}</table></div>`}
async function reset2fa(id){if(confirm('¿Quitar la verificación en dos pasos de este usuario? Tendrá que activarla de nuevo.'))try{await api('POST','/usuarios/'+id+'/reset-2fa');render()}catch(e){fail(e)}}
async function addUsr(){try{await api('POST','/usuarios',{usuario:$('#nu').value,rol:$('#nr').value,password:$('#np').value});toast('Usuario creado');render()}catch(e){fail(e)}}
async function togUsr(id,a){try{await api('PATCH','/usuarios/'+id,{activo:a});render()}catch(e){fail(e)}}
function passM(id){modal(`<div class="box"><h3>${id?'Nueva contraseña del usuario':'Cambiar mi contraseña'}</h3>${id?'':'<input id="pa" type="password" placeholder="Contraseña actual">'}<input id="pn" type="password" placeholder="Nueva (mín. 10, letras y números)"><div class="row"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn" style="flex:1" onclick="savePass(${id})">Guardar</button></div></div>`)}
async function savePass(id){try{id?await api('PATCH','/usuarios/'+id,{password:$('#pn').value}):await api('POST','/cambiar-password',{actual:$('#pa').value,nueva:$('#pn').value});closeM();toast('Contraseña actualizada')}catch(e){fail(e)}}
function vQr(){return `<p class="mut">Un QR por mesa. Genéralos desde la dirección definitiva del sitio: cada uno abre el menú con la mesa ya cargada.</p><div class="row"><span>Número de mesas</span><input type="number" min="1" max="60" value="${nMesas}" style="width:90px" onchange="nMesas=Math.min(60,Math.max(1,+this.value||1));draw()"></div><div class="qrs">${Array.from({length:nMesas},(_,i)=>`<div class="card"><b>Mesa ${i+1}</b><div id="q${i+1}"></div></div>`).join('')}</div>`}
function pintaQr(){if(typeof QRCode==='undefined')return;for(let n=1;n<=nMesas;n++)new QRCode($('#q'+n),{text:location.origin+'/?mesa='+n,width:110,height:110})}
/* ===================== Sesión, 2FA y arranque ===================== */
function loginM(){modal(`<div class="box"><h3>Ingreso del personal</h3><input id="lu" placeholder="Usuario" autocomplete="username"><input id="lp" type="password" placeholder="Contraseña" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><div class="row"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn" style="flex:1" onclick="login()">Entrar</button></div></div>`)}
let tmp2=null;
async function login(){try{const r=await api('POST','/login',{usuario:$('#lu').value,password:$('#lp').value});
 if(r.requiere_2fa){tmp2=r.temp;modal(`<div class="box"><h3>Verificación en dos pasos</h3><p class="mut">Cuenta: <b>${esc(r.usuario||'')}</b>. Escribe el código de 6 dígitos de la entrada <b>«Fercho · ${esc(r.usuario||'')}»</b> de tu app (o un código de recuperación). Si falla, espera a que cambie el número e inténtalo con el nuevo.</p><input id="lc" autocomplete="one-time-code" placeholder="Código" onkeydown="if(event.key==='Enter')login2()"><div class="row"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn" style="flex:1" onclick="login2()">Verificar</button></div></div>`);return}
 await entrar(r)}catch(e){fail(e)}}
async function login2(){try{await entrar(await api('POST','/login/2fa',{temp:tmp2,codigo:$('#lc').value}))}catch(e){fail(e)}}
async function entrar(r){U={u:r.usuario,rol:r.rol,totp:r.totp,ex:r.exigida};closeM();view=home();await render();alertas();if(r.debe_configurar_2fa)setup2faM()}
function sesionVencida(){U=null;AL=[];pintaAl();view='menu';cart=[];render()}
async function logout(){try{await api('POST','/logout')}catch(e){}sesionVencida()}
async function setup2faM(){try{const r=await api('POST','/2fa/preparar');modal(`<div class="box"><h3>Verificación en dos pasos</h3><p class="mut">Cuenta: <b>${esc(r.usuario)}</b>. 1) Instala Google Authenticator, Microsoft Authenticator o similar. 2) Escanea este código (aparecerá como «Fercho · ${esc(r.usuario)}»; borra entradas viejas del mismo nombre). 3) Escribe el código de 6 dígitos.</p><div id="q2" style="display:flex;justify-content:center;margin:8px"></div><p class="mut" style="word-break:break-all">Si no puedes escanear, escribe esta clave en la app: <b>${esc(r.secreto)}</b></p><input id="c2" inputmode="numeric" maxlength="7" placeholder="Código de 6 dígitos"><div class="row"><button class="btn ghost" onclick="closeM()">Después</button><button class="btn" style="flex:1" onclick="activar2fa()">Activar</button></div></div>`);if(typeof QRCode!=='undefined')new QRCode($('#q2'),{text:r.uri,width:160,height:160})}catch(e){if(!/ya tienes/i.test(e.message))fail(e)}}
function desact2faM(){modal(`<div class="box"><h3>Desactivar verificación en dos pasos</h3><p class="mut">Tu cuenta quedará protegida solo por la contraseña. Confirma con tu contraseña y un código actual de la app (o de recuperación). Puedes volver a activarla cuando quieras.</p><input id="dp" type="password" placeholder="Contraseña" autocomplete="current-password"><input id="dc" autocomplete="one-time-code" placeholder="Código" onkeydown="if(event.key==='Enter')desact2fa()"><div class="row"><button class="btn ghost" onclick="closeM()">Cancelar</button><button class="btn" style="flex:1" onclick="desact2fa()">Desactivar</button></div></div>`)}
async function desact2fa(){try{await api('POST','/2fa/desactivar',{password:$('#dp').value,codigo:$('#dc').value});U.totp=false;closeM();draw();toast('Verificación en dos pasos desactivada')}catch(e){fail(e)}}
async function activar2fa(){try{const r=await api('POST','/2fa/activar',{codigo:$('#c2').value});U.totp=true;modal(`<div class="box"><h3>¡Listo! Guarda estos códigos</h3><p class="mut">Sirven una sola vez si pierdes el celular. Anótalos en un lugar seguro; no se vuelven a mostrar.</p><p style="font-family:monospace;line-height:1.8">${r.recuperacion.map(c=>esc(c.slice(0,5)+'-'+c.slice(5))).join('<br>')}</p><button class="btn lg" onclick="closeM();draw()">Ya los guardé</button></div>`)}catch(e){fail(e)}}
const vivo=()=>['cocina','caja','mio','tur','cont'].includes(view)&&!$('#modal').innerHTML;
try{const es=new EventSource('/api/eventos');let tm;es.onmessage=()=>{clearTimeout(tm);tm=setTimeout(()=>{alertas();if(vivo())render();else if(view==='menu'&&!$('#modal').innerHTML)api('GET','/config').then(x=>{const ch=x.abierto!==C.abierto;C=x;if(ch)render()}).catch(()=>{})},300)}}catch(e){}
let ult=Date.now();['click','keydown','touchstart'].forEach(e=>addEventListener(e,()=>{ult=Date.now()},{passive:true}));
setInterval(()=>{if(U&&['admin','caja'].includes(U.rol)&&Date.now()-ult>30*60*1000){logout();toast('Se cerró tu sesión por inactividad.',true)}},60000);
setInterval(()=>{alertas();if(vivo())render()},20000);
(async()=>{try{const y=await api('GET','/yo');U={u:y.usuario,rol:y.rol,totp:y.totp,ex:y.exigida};view=home();if(y.p2)setTimeout(setup2faM,300)}catch(e){}render();alertas()})();
</script></body></html>
